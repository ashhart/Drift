name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    # The reference suite needs no model downloads, no Studio, no Sparks and no MCDMA daemon.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the reference environment
        run: python -m pip install -e '.[test]'
      - name: Run the reference suite
        run: python -m pytest -q
      - name: Check the CLI entry point resolves
        run: |
          drift --help
          drift adapter list

  plugin:
    # The omp-drift plugin is TypeScript under Bun; it has no Python or hardware dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install plugin dependencies
        working-directory: plugin/omp-drift
        run: bun install --frozen-lockfile || bun install
      - name: Run plugin tests
        working-directory: plugin/omp-drift
        run: bun test
      - name: Typecheck
        working-directory: plugin/omp-drift
        run: bunx tsc -p tsconfig.json
